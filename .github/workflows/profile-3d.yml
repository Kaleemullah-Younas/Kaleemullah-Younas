# ─── yoshi389111/github-profile-3d-contrib ────────────────────────────────────
# Generates a 3D isometric contribution graph and commits the SVGs to this repo.
# They land in: profile-3d-contrib/<variant>.svg
#
# In README.md the dark/light pair looks like:
#   <picture>
#     <source media="(prefers-color-scheme: dark)" srcset="profile-3d-contrib/profile-night-rainbow.svg" />
#     <img src="profile-3d-contrib/profile-season-animate.svg" width="100%" alt="3D contribution graph" />
#   </picture>
#
# SETUP — one-time:
# No extra secret needed! The default GITHUB_TOKEN GitHub provides automatically
# is enough for a public profile repo. If you want private contributions
# included, replace ${{ secrets.GITHUB_TOKEN }} below with a classic PAT that
# has the repo scope, added as secret METRICS_TOKEN (same one as metrics.yml).
#
# Available SVG variants committed to profile-3d-contrib/:
#   profile-green.svg             plain green bars
#   profile-green-animate.svg     animated version
#   profile-night-green.svg       dark green
#   profile-night-rainbow.svg     dark + rainbow (great for dark mode!)
#   profile-night-view.svg        dark classic
#   profile-season-animate.svg    seasons animated (great for light mode!)
#   profile-season.svg            seasons static
#   profile-south-season.svg      southern-hemisphere seasons
#   profile-gitblock.svg          git-block style
# ──────────────────────────────────────────────────────────────────────────────

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC daily (23:00 PKT)
  workflow_dispatch:         # run manually from the Actions tab any time

permissions:
  contents: write            # needed to commit SVGs back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Optional: point to a custom settings file for colours/themes
          # SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Commit & Push
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: regenerate 3D contribution graph [skip ci]"; then
            git push
          else
            echo "Nothing changed — skipping push."
          fi
